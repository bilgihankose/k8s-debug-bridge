<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs>
 <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#111111"/></linearGradient>
 <linearGradient id="rflow2" x1="1" y1="0" x2="0" y2="0">
  <stop offset="0%" stop-color="#444444"/><stop offset="100%" stop-color="#111111"/></linearGradient>
 <marker id="ar2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#111111"/></marker>
 <marker id="arw2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#DC2626"/></marker>
 <marker id="ard2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#AAAAAA"/></marker>
</defs><rect width="1400" height="800" fill="#F1F1F1"/><text x="80" y="78" font-family="Gelasio,Georgia,Charter,serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">A pipe has one direction. A socket has two.</text><text x="80" y="118" font-family="Gelasio,Georgia,Charter,serif" font-size="20" fill="#6B7280">This is why the tunnel is built the way it is.</text><text x="80" y="206" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#DC2626" letter-spacing="2.5">A | B — NOT ENOUGH</text><rect x="80" y="232" width="230" height="84" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="195" y="281" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6B7280" text-anchor="middle">process A</text><rect x="560" y="232" width="230" height="84" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="675" y="281" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6B7280" text-anchor="middle">process B</text><path d="M318,258 L548,258" stroke="#111111" stroke-width="3" marker-end="url(#ar2)"/><text x="433" y="244" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#111111" text-anchor="middle">stdout → stdin</text><path d="M548,296 L322,296" stroke="#DC2626" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arw2)" opacity="0.9"/><g stroke="#DC2626" stroke-width="4.5" stroke-linecap="round"><path d="M421,284 L445,308"/><path d="M445,284 L421,308"/></g><text x="850" y="268" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#DC2626" font-weight="600">The response has no way back.</text><text x="850" y="298" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">The caller inside the cluster just waits.</text><rect x="80" y="404" width="1240" height="1" fill="#DDDDDD"/><text x="80" y="466" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">ONE SOCKET, BOTH ENDS</text><rect x="80" y="494" width="370" height="118" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="265" y="542" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#111111" text-anchor="middle">kubectl exec -i</text><text x="265" y="572" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">nc -l -p 8000</text><path d="M460,528 L860,528" stroke="#111111" stroke-width="3.5" marker-end="url(#ar2)"/><text x="660" y="514" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">stdin &lt;&gt; /dev/tcp/127.0.0.1/8000</text><path d="M860,578 L464,578" stroke="#111111" stroke-width="3.5" marker-end="url(#ar2)"/><text x="660" y="606" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">stdout &gt;&amp;0</text><g opacity="1.0"><rect x="880" y="494" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><rect x="900" y="518" width="86" height="7" rx="3.5" fill="#111111" opacity="0.85"/><rect x="900" y="536" width="58" height="7" rx="3.5" fill="#111111" opacity="0.45"/><rect x="862" y="598" width="186" height="8" rx="4" fill="#111111" opacity="0.65"/></g><text x="955" y="640" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#111111" text-anchor="middle">your local app</text><text x="80" y="700" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">One file descriptor, both directions: the request goes in and the response comes back over the same connection.</text></svg>