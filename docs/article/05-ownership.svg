<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs>
 <marker id="ar5" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#111111"/></marker>
 <marker id="ar5r" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#DC2626"/></marker>
 <g id="bilgihan">
   <circle cx="0" cy="0" r="23" fill="#111111"/>
   <text x="0" y="7" font-family="ui-sans-serif,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
 </g>
 <g id="sarah">
   <circle cx="0" cy="0" r="23" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
   <text x="0" y="7" font-family="ui-sans-serif,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="middle">S</text>
 </g>
</defs>
<rect width="1400" height="800" fill="#F1F1F1"/>
<text x="80" y="74" font-family="Gelasio,Georgia,Charter,serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">Two developers, one Service</text>
<text x="80" y="112" font-family="Gelasio,Georgia,Charter,serif" font-size="20" fill="#6B7280">Local state cannot tell you who is already bridging it. The cluster can.</text>

<text x="80" y="180" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#DC2626" letter-spacing="2.5">LOCAL STATE ONLY</text>

<use href="#bilgihan" x="118" y="240"/>
<text x="118" y="288" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#111111" text-anchor="middle">Bilgihan</text>
<rect x="164" y="206" width="212" height="68" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="270" y="236" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">bridges</text>
<text x="270" y="258" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">auth-service</text>
<path d="M384,240 L428,240" stroke="#111111" stroke-width="2.5" marker-end="url(#ar5)"/>
<rect x="436" y="206" width="238" height="68" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="555" y="236" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">selector now</text>
<text x="555" y="258" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#DC2626" text-anchor="middle">debug=bilgihan-bridge</text>

<use href="#sarah" x="726" y="240"/>
<text x="726" y="288" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#111111" text-anchor="middle">Sarah</text>
<rect x="772" y="206" width="204" height="68" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="874" y="236" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">runs</text>
<text x="874" y="258" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">bridge-up.sh</text>
<path d="M984,240 L1028,240" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ar5r)"/>
<rect x="1036" y="206" width="284" height="68" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
<text x="1178" y="236" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">saves debug=bilgihan-bridge</text>
<text x="1178" y="258" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">as &#34;the original&#34;</text>

<text x="80" y="342" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#DC2626" font-weight="600">Sarah cleans up — and restores the Service to Bilgihan&#39;s bridge, not to the real pods.</text>
<text x="80" y="372" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">No command fails. Neither of them sees an error. The service simply stops being itself.</text>

<rect x="80" y="428" width="1240" height="1" fill="#DDDDDD"/>

<text x="80" y="486" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">WITH THE OWNER ANNOTATION</text>
<rect x="80" y="510" width="424" height="112" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
<text x="104" y="544" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6B7280">Service · metadata.annotations</text>
<text x="104" y="574" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111">k8s-debug-bridge/owner:</text>
<text x="104" y="600" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111">bilgihan@laptop 2026-09-05T09:14Z</text>

<path d="M512,566 L556,566" stroke="#111111" stroke-width="2.5" marker-end="url(#ar5)"/>
<use href="#sarah" x="608" y="566"/>
<text x="608" y="614" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#111111" text-anchor="middle">Sarah</text>
<rect x="654" y="532" width="204" height="68" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="756" y="562" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">runs</text>
<text x="756" y="584" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">bridge-up.sh</text>
<path d="M866,566 L910,566" stroke="#111111" stroke-width="2.5" marker-end="url(#ar5)"/>
<rect x="918" y="532" width="402" height="68" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="1119" y="562" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">refused — already bridged by</text>
<text x="1119" y="584" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">bilgihan@laptop</text>

<text x="80" y="694" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">The cluster, not either laptop, holds the answer to &#34;who is bridging this right now?&#34;</text>
<text x="80" y="724" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">Not an atomic lock — two people starting in the same second can still race past it. It closes the case that actually happens.</text>
</svg>
