</defs><rect width="1400" height="800" fill="#F1F1F1"/><text x="80" y="78" font-family="Gelasio,Georgia,Charter,serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">One label decides where traffic lands</text><text x="80" y="118" font-family="Gelasio,Georgia,Charter,serif" font-size="20" fill="#6B7280">The Service never notices. kube-proxy simply follows the selector.</text><text x="80" y="200" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#AAAAAA" letter-spacing="2.5">BEFORE</text><rect x="80" y="220" width="520" height="54" rx="10" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="104" y="254" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6B7280">selector: <tspan fill="#111111" font-weight="600">app=auth</tspan></text><path d="M340,278 L340,306" stroke="#AAAAAA" stroke-width="2.5"/><g opacity="1.0"><rect x="80" y="318" width="520" height="140" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="104" y="350" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#AAAAAA" letter-spacing="2.5">REAL PODS</text><polygon points="210.0,376.0 232.5,389.0 232.5,415.0 210.0,428.0 187.5,415.0 187.5,389.0" fill="#EDEDED" stroke="#BBBBBB" stroke-width="1.8" opacity="1"/><text x="210.0" y="407.0" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">pod</text><polygon points="340.0,376.0 362.5,389.0 362.5,415.0 340.0,428.0 317.5,415.0 317.5,389.0" fill="#EDEDED" stroke="#BBBBBB" stroke-width="1.8" opacity="1"/><text x="340.0" y="407.0" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">pod</text><polygon points="470.0,376.0 492.5,389.0 492.5,415.0 470.0,428.0 447.5,415.0 447.5,389.0" fill="#EDEDED" stroke="#BBBBBB" stroke-width="1.8" opacity="1"/><text x="470.0" y="407.0" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">pod</text></g><text x="80" y="524" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">AFTER</text><rect x="80" y="544" width="520" height="54" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="104" y="578" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#6B7280">selector: <tspan fill="#111111" font-weight="600">debug=my-bridge</tspan></text><path d="M340,602 L340,630" stroke="#111111" stroke-width="2.5"/><g opacity="1.0"><rect x="80" y="642" width="520" height="140" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="104" y="674" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#AAAAAA" letter-spacing="2.5">SAME SERVICE, NEW TARGET</text><polygon points="210.0,700.0 232.5,713.0 232.5,739.0 210.0,752.0 187.5,739.0 187.5,713.0" fill="#FAFAFA" stroke="#AAAAAA" stroke-width="1.8" opacity="0.5"/><text x="210.0" y="731.0" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#AAAAAA" text-anchor="middle">pod</text><polygon points="340.0,696.0 366.0,711.0 366.0,741.0 340.0,756.0 314.0,741.0 314.0,711.0" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" opacity="1.0"/><text x="340.0" y="731.0" font-family="ui-sans-serif,sans-serif" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">bridge</text><polygon points="470.0,700.0 492.5,713.0 492.5,739.0 470.0,752.0 447.5,739.0 447.5,713.0" fill="#FAFAFA" stroke="#AAAAAA" stroke-width="1.8" opacity="0.5"/><text x="470.0" y="731.0" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#AAAAAA" text-anchor="middle">pod</text></g><path d="M620,712 C720,712 760,596 860,596" stroke="#111111" stroke-width="4" fill="none" marker-end="url(#ar1)"/><g opacity="1.0"><rect x="880" y="548" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/><rect x="900" y="572" width="86" height="7" rx="3.5" fill="#111111" opacity="0.85"/><rect x="900" y="590" width="58" height="7" rx="3.5" fill="#111111" opacity="0.45"/><rect x="862" y="652" width="186" height="8" rx="4" fill="#111111" opacity="0.65"/></g><text x="955" y="694" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#111111" text-anchor="middle">127.0.0.1:8000</text><text x="880" y="270" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111" font-weight="600">The real pods keep running.</text><text x="880" y="302" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">Healthy, ready — and completely</text><text x="880" y="330" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">bypassed until you clean up.</text><text x="880" y="392" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#DC2626">That is the whole risk of this method.</text></svg>