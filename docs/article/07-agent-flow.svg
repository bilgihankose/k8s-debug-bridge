<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="1400" height="800" fill="#F1F1F1"/>
<text x="80" y="74" font-family="Gelasio,Georgia,Charter,serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">Running it by asking</text>
<text x="80" y="112" font-family="Gelasio,Georgia,Charter,serif" font-size="20" fill="#6B7280">You describe the goal. The agent runs the scripts — and stops at the one step that touches real traffic.</text>

<!-- human avatar -->
<g transform="translate(112,186)">
  <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="0" cy="-7" r="9" fill="#111111"/>
  <path d="M-13,13 A13,13 0 0 1 13,13" fill="#111111"/>
  <text x="0" y="52" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#6B7280" text-anchor="middle" letter-spacing="2">YOU</text>
</g>

<!-- robot avatar -->
<g transform="translate(1288,186)">
  <path d="M0,-34 L0,-25" stroke="#111111" stroke-width="2.5"/>
  <circle cx="0" cy="-37" r="4" fill="#111111"/>
  <rect x="-27" y="-24" width="54" height="46" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
  <circle cx="-10" cy="-4" r="5" fill="#111111"/>
  <circle cx="10" cy="-4" r="5" fill="#111111"/>
  <path d="M-9,10 L9,10" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <text x="0" y="52" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#6B7280" text-anchor="middle" letter-spacing="2">AGENT</text>
</g>

<!-- 1: human -->
<path d="M188,196 L166,182 L188,168 Z" fill="#111111"/>
<rect x="186" y="158" width="602" height="62" rx="16" fill="#111111"/>
<text x="214" y="196" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#FFFFFF">Debug auth-service in the dev namespace locally, on port 8000.</text>

<!-- 2: agent -->
<path d="M1212,276 L1234,262 L1212,248 Z" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<rect x="612" y="238" width="602" height="62" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="640" y="268" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111">Bridge pod is up, and it does ship <tspan font-family="ui-monospace,Menlo,monospace" font-size="17">nc</tspan>.</text>
<text x="640" y="292" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280">bridge-up.sh dev auth-service my-bridge nicolaka/netshoot</text>

<!-- 3: agent, approval -->
<path d="M1212,382 L1234,368 L1212,354 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
<rect x="548" y="320" width="666" height="106" rx="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
<g transform="translate(586,362)">
  <path d="M0,-16 L15,10 L-15,10 Z" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M0,-8 L0,1" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="0" cy="6" r="1.6" fill="#DC2626"/>
</g>
<text x="622" y="358" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111">Redirecting sends ALL traffic for auth-service to the bridge pod.</text>
<text x="622" y="384" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111">The real pods stop receiving it.</text>
<text x="622" y="410" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#DC2626" font-weight="600">Do you confirm?</text>

<!-- 4: human -->
<path d="M188,484 L166,470 L188,456 Z" fill="#111111"/>
<rect x="186" y="446" width="120" height="54" rx="16" fill="#111111"/>
<text x="246" y="481" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#FFFFFF" text-anchor="middle">yes</text>

<!-- 5: agent -->
<path d="M1212,558 L1234,544 L1212,530 Z" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<rect x="612" y="520" width="602" height="62" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="640" y="550" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111">Redirected and the tunnel is up. Start Air + Delve and attach.</text>
<text x="640" y="574" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280">redirect-service.sh --yes  ·  tunnel.sh (own process)</text>

<!-- terminal strip -->
<rect x="80" y="622" width="1240" height="106" rx="14" fill="#111111"/>
<circle cx="112" cy="650" r="6" fill="#FF5F57"/><circle cx="134" cy="650" r="6" fill="#FEBC2E"/><circle cx="156" cy="650" r="6" fill="#28C840"/>
<text x="182" y="655" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#8A8A8A">tunnel.sh — dev/auth-service</text>
<text x="112" y="692" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#28C840">✓</text>
<text x="138" y="692" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#F1F1F1">Tunnel starting: my-bridge:8000 &lt;-&gt; 127.0.0.1:8000 (one connection at a time)</text>
<text x="112" y="716" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#8A8A8A">Ctrl+C here restores the Service and deletes the bridge pod.</text>
</svg>
