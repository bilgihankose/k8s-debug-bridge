rx="9" fill="#F7F7F7" stroke="#E5E5E5" stroke-width="1.4"/><text x="695" y="436" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">CAP_SYS_PTRACE</text><rect x="538" y="466" width="314" height="44" rx="9" fill="#F7F7F7" stroke="#E5E5E5" stroke-width="1.4"/><text x="695" y="494" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">CAP_SYS_ADMIN</text><text x="695" y="608" font-family="ui-sans-serif,sans-serif" font-size="17" fill="#6B7280" text-anchor="middle">host / kernel privileges</text><text x="940" y="214" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">K8S-DEBUG-BRIDGE</text><rect x="940" y="238" width="370" height="330" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-dasharray="9 7"/><rect x="968" y="292" width="314" height="44" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="1.4"/><text x="1125" y="320" font-family="ui-sans-serif,sans-serif" font-size="16" fill="#111111" text-anchor="middle">bridge pod</text><text x="1125" y="608" font-family="ui-sans-serif,sans-serif" font-size="17" fill="#111111" text-anchor="middle">deleted when the tunnel closes</text><text x="80" y="700" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">None of them is wrong. They just ask for different amounts of trust.</text></svg>