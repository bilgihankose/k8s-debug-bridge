<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><defs>
 <marker id="ar6" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#111111"/></marker>
 <marker id="ar6d" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#DC2626"/></marker>
 <marker id="ar6g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#AAAAAA"/></marker>
</defs>
<rect width="1400" height="800" fill="#F1F1F1"/>
<text x="80" y="78" font-family="Gelasio,Georgia,Charter,serif" font-size="40" font-weight="700" fill="#111111" letter-spacing="-0.5">One paused request, two clients</text>
<text x="80" y="118" font-family="Gelasio,Georgia,Charter,serif" font-size="20" fill="#6B7280">An agent can read the stop. Resuming it is still your call.</text>

<text x="80" y="196" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">THE REQUEST</text>
<rect x="80" y="222" width="210" height="86" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="185" y="258" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">cluster caller</text>
<text x="185" y="282" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6B7280" text-anchor="middle">real dev traffic</text>
<path d="M298,265 L358,265" stroke="#111111" stroke-width="3" marker-end="url(#ar6)"/>
<rect x="366" y="222" width="180" height="86" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="456" y="272" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">tunnel</text>
<path d="M554,265 L614,265" stroke="#111111" stroke-width="3" marker-end="url(#ar6)"/>
<rect x="622" y="210" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
<text x="772" y="250" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#111111" text-anchor="middle">your app</text>
<text x="772" y="278" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#DC2626" text-anchor="middle">stopped at breakpoint</text>
<text x="772" y="302" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6B7280" text-anchor="middle">the caller is still waiting</text>

<rect x="80" y="386" width="1240" height="1" fill="#DDDDDD"/>

<text x="80" y="446" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#111111" letter-spacing="2.5">THE DEBUGGER — dlv --headless --accept-multiclient</text>
<rect x="80" y="472" width="330" height="120" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
<text x="245" y="514" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#111111" text-anchor="middle">dlv on :2345</text>
<text x="245" y="544" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">holds the paused goroutine,</text>
<text x="245" y="568" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#6B7280" text-anchor="middle">serves more than one client</text>

<path d="M418,506 L540,506" stroke="#111111" stroke-width="2.5" marker-end="url(#ar6)"/>
<rect x="548" y="470" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="698" y="500" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">VS Code — attached</text>
<text x="698" y="524" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6B7280" text-anchor="middle">steps, resumes, sets variables</text>

<path d="M418,558 L540,558" stroke="#AAAAAA" stroke-width="2.5" marker-end="url(#ar6g)"/>
<rect x="548" y="558" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="698" y="588" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">agent — attached</text>
<text x="698" y="612" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#6B7280" text-anchor="middle">reads stack, frames, variables</text>

<path d="M856,594 L968,594" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ar6d)"/>
<rect x="976" y="558" width="344" height="72" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
<text x="1148" y="588" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#111111" text-anchor="middle">continue / change state</text>
<text x="1148" y="612" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#DC2626" text-anchor="middle">asks you first</text>

<text x="80" y="700" font-family="ui-sans-serif,sans-serif" font-size="19" fill="#111111" font-weight="600">Looking is free. Resuming is not.</text>
<text x="80" y="730" font-family="ui-sans-serif,sans-serif" font-size="18" fill="#6B7280">That paused frame is a real request from a shared cluster — someone downstream is timing it.</text>
</svg>
