<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <defs>
    <marker id="arrowhead-flow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#111111" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="520" fill="#F1F1F1" />

  <!-- Card 1: check-env.sh -->
  <rect x="90" y="190" width="212" height="140" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
  <text x="110" y="224" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#AAAAAA" letter-spacing="2.5">STEP 1</text>
  <text x="110" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold" fill="#111111">check-env.sh</text>
  <text x="110" y="284" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">read-only</text>
  <text x="110" y="304" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">pre-flight</text>

  <!-- Flow 1 -> 2 -->
  <line x1="308" y1="260" x2="334" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowhead-flow)"/>

  <!-- Card 2: bridge-up.sh -->
  <rect x="342" y="190" width="212" height="140" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
  <text x="362" y="224" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#AAAAAA" letter-spacing="2.5">STEP 2</text>
  <text x="362" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold" fill="#111111">bridge-up.sh</text>
  <text x="362" y="284" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">creates bridge pod,</text>
  <text x="362" y="304" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">saves original selector</text>

  <!-- Flow 2 -> 3 -->
  <line x1="560" y1="260" x2="586" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowhead-flow)"/>

  <!-- Card 3: redirect-service.sh -->
  <rect x="594" y="190" width="212" height="140" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
  <text x="614" y="224" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#AAAAAA" letter-spacing="2.5">STEP 3</text>
  <text x="614" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold" fill="#111111">redirect-service.sh</text>
  <text x="614" y="284" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">points service</text>
  <text x="614" y="304" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">selector at the bridge</text>

  <!-- Flow 3 -> 4 -->
  <line x1="812" y1="260" x2="838" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowhead-flow)"/>

  <!-- Card 4: tunnel.sh -->
  <rect x="846" y="190" width="212" height="140" rx="6" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>
  <text x="866" y="224" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#AAAAAA" letter-spacing="2.5">STEP 4</text>
  <text x="866" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold" fill="#111111">tunnel.sh</text>
  <text x="866" y="284" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">reverse tunnel,</text>
  <text x="866" y="304" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">blocking</text>

  <!-- Flow 4 -> 5 -->
  <line x1="1064" y1="260" x2="1090" y2="260" stroke="#111111" stroke-width="2" marker-end="url(#arrowhead-flow)"/>

  <!-- Card 5: cleanup.sh -->
  <rect x="1098" y="190" width="212" height="140" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1118" y="224" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#AAAAAA" letter-spacing="2.5">STEP 5</text>
  <text x="1118" y="254" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="bold" fill="#111111">cleanup.sh</text>
  <text x="1118" y="284" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">restores everything,</text>
  <text x="1118" y="304" font-family="Gelasio,Georgia,Charter,serif" font-size="15" fill="#6B7280">usually automatic</text>

  <!-- Return Flow: cleanup.sh -> redirect-service.sh -->
  <path d="M 1204 336 L 1204 380 Q 1204 400 1184 400 L 720 400 Q 700 400 700 380 L 700 338" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrowhead-flow)"/>
  <text x="952" y="426" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="2.5">TRAP EXIT/INT/TERM</text>
</svg>